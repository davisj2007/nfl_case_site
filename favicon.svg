<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CASE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    CASE — favicon, 16-32px. The primary mark simplified: five bars instead of
    nine, a heavier line, no grid. At full detail the bars and line merge into
    one texture below ~64px; what must survive is bars against a line, a
    running total rising through them, and the yellow point.
  -->
  <rect width="64" height="64" rx="10" fill="#0a0a0a"/>
  <g opacity="0.7">
        <rect x="10.5" y="32.5" width="7" height="11.5" rx="1" fill="#00ff88"/>
    <rect x="20.5" y="44" width="7" height="7.2" rx="1" fill="#ff6600"/>
    <rect x="30.5" y="28.2" width="7" height="15.8" rx="1" fill="#00ff88"/>
    <rect x="40.5" y="44" width="7" height="8.6" rx="1" fill="#ff6600"/>
    <rect x="50.5" y="31.0" width="7" height="13.0" rx="1" fill="#00ff88"/>
  </g>
  <path d="M4 44 H60" stroke="#c0c0c0" stroke-width="1.6"/>
  <path d="M6.0 44.0 L14.0 32.5 L24.0 39.7 L34.0 23.8 L44.0 32.5 L54.0 19.5" fill="none" stroke="#00ffff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="19.5" r="5.5" fill="#ffff00"/>
</svg>
